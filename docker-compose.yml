
# Hospital Management System - full stack
# Postgres + EF migrations + API + Frontend on http://localhost:8080
#
# Quick start:
#   cp .env.docker.example .env.docker
#   # edit JWT_SECRET and GEMINI_API_KEY
#   docker compose --env-file .env.docker up --build
#
# Migrations run automatically via the "migrate" service before the API starts.

services:
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-HospitalManagement}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hospital_net

  # One-shot migration runner (uses SDK image + dotnet-ef)
  migrate:
    build:
      context: ./HospitalSys
      dockerfile: Dockerfile
      target: migrate
    container_name: hospital_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-HospitalManagement}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${DB_NAME:-HospitalManagement};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}"
      # Required because Program.cs validates these at startup
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-HospitalSys}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-HospitalSysClient}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-placeholder-for-migrations-only}
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - hospital_net
    restart: "no"
  backend:
    build:
      context: ./HospitalSys
      dockerfile: Dockerfile
      target: final
    container_name: hospital_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-HospitalManagement}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-HospitalSys}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-HospitalSysClient}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-jwt}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - hospital_uploads:/app/wwwroot/uploads
    ports:
      - "${API_HOST_PORT:-5000}:8080"
    networks:
      - hospital_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = browser uses relative URLs (same origin via nginx proxy)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: hospital_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - hospital_net

volumes:
  hospital_pgdata:
  hospital_uploads:

networks:
  hospital_net:
    driver: bridge
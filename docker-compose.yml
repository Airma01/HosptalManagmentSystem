
services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: hospital-postgres
    environment:
      POSTGRES_DB: HospitalManagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "7475"
    ports:
      - "5433:5432"
    volumes:
      - hospital-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HospitalManagement"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 2. Apply EF Core Database Migrations
  migrate:
    build:
      context: ./HospitalSys
      dockerfile: Dockerfile
      target: migrate
    image: ehr-backend-migrate:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: HospitalManagement
      DB_USER: postgres
      DB_PASSWORD: "7475"
      JWT_SECRET: "jkglfhghl45554554klsdjskjdksjfkjfndkj34hk32j4kj4k54tjtnkjntk3n4ktjnkjfjwewkwjflkdjflsjljfhksdfh4w443"
      JWT_ISSUER: HospitalSys
      JWT_AUDIENCE: HospitalSysClient
      JWT_EXPIRATION_MINUTES: "120"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["database", "update"]
    restart: "no"

  # 3. ASP.NET Core Backend API
  api:
    build:
      context: ./HospitalSys
      dockerfile: Dockerfile
    image: ehr-backend:latest
    container_name: ehr-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: HospitalManagement
      DB_USER: postgres
      DB_PASSWORD: "7475"

      JWT_SECRET: "REPLACE_WITH_YOUR_RANDOM_Sjkglfhghl45554554klsdjskjdksjfkjfndkj34hk32j4kj4k54tjtnkjntk3n4ktjnkjfjwewkwjflkdjflsjljfhksdfh4w443ECRET_AT_LEAST_32_CHARACTERS_LONG"
      JWT_ISSUER: HospitalSys
      JWT_AUDIENCE: HospitalSysClient
      JWT_EXPIRATION_MINUTES: "120"
      JWT_COOKIE_NAME: jwt
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_SAMESITE: Lax
      JWT_COOKIE_DOMAIN: ""

      CORS_ORIGINS: "http://localhost:8080"
      GEMINI_API_KEY: "REPLACE_WITH_YOUR_NEW_GEMINI_API_KEY"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  # 4. React Frontend served by Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5000"
    image: ehr-frontend:latest
    container_name: ehr-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

# Persistent PostgreSQL storage
volumes:
  hospital-postgres-data: